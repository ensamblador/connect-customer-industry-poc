openapi: 3.0.1
info:
  title: Airline Self-Service API
  description: >
    REST API for AeroLatam self-service: available flights catalog with
    origin/destination filtering, frequent-flyer account lookup (by id,
    phone number, or email), account flights inquiry, and flight reservations.
    Exposed to the Connect AI agent as MCP tools through a Bedrock AgentCore
    gateway.
  version: 4.0.0
  contact:
    name: airline-cx

# The server URL is rendered at deploy time. ${ApiId} and ${Stage} are
# substituted (CloudFormation Fn::Sub) with the real deployed REST API id and
# stage; ${AWS::Region} is the deploy region pseudo-parameter. Do not hardcode
# a real host here — the rendered spec is what the gateway uses.
servers:
  - url: https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    description: Deployed Airline self-service API Gateway endpoint

tags:
  - name: Accounts
    description: Frequent-flyer account profile, flights, and phone/email lookup
  - name: Flights
    description: Available flights catalog operations
  - name: Reservations
    description: Flight reservation operations

security:
  - ApiKeyAuth: []

paths:
  /accounts:
    get:
      operationId: getAccountByPhone
      summary: Look up a frequent-flyer account by phone number
      description: >
        Find a customer's AeroLatam account by their phone number (E.164
        format, e.g. +12065550101). Use this when the customer is identified
        by phone rather than account id. Returns the full account profile.
      tags:
        - Accounts
      parameters:
        - name: phoneNumber
          in: query
          required: true
          description: The customer's phone number in E.164 format.
          schema:
            type: string
          example: '+12065550101'
      responses:
        '200':
          description: The matching account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Missing phoneNumber query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No account found for the supplied phone number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/by-email:
    get:
      operationId: getAccountByEmail
      summary: Look up a frequent-flyer account by email address
      description: >
        Find a customer's AeroLatam account by their email address. Use this
        when the customer is identified by email rather than account id or
        phone. Returns the full account profile.
      tags:
        - Accounts
      parameters:
        - name: email
          in: query
          required: true
          description: The customer's email address.
          schema:
            type: string
            format: email
          example: maria.gonzalez@example.com
      responses:
        '200':
          description: The matching account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Missing email query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No account found for the supplied email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{accountId}:
    get:
      operationId: getAccount
      summary: Get a customer's account profile
      description: >
        Get the full profile for an AeroLatam frequent-flyer account by
        account id, including name, email, phone, membership tier, miles,
        and associated flight ids.
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique airline account identifier.
          schema:
            type: string
          example: acct-1001
      responses:
        '200':
          description: The account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: No account found for the supplied accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /accounts/{accountId}/flights:
    get:
      operationId: getAccountFlights
      summary: Get the flights associated with an account
      description: >
        Get the list of flight ids associated with a customer's account,
        along with their membership tier and miles balance. Use this to
        check what flights the customer has booked or is tracking.
      tags:
        - Accounts
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique airline account identifier.
          schema:
            type: string
          example: acct-1001
      responses:
        '200':
          description: The account's associated flights.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountId
                  - flights
                  - membershipTier
                  - miles
                properties:
                  accountId:
                    type: string
                    example: acct-1001
                  flights:
                    type: array
                    maxItems: 50
                    items:
                      type: string
                    description: List of flightId values associated with this account.
                    example: ['flight-AL100', 'flight-AL305']
                  membershipTier:
                    type: string
                    description: Customer's membership tier (classic, gold, platinum).
                    example: gold
                  miles:
                    type: number
                    description: Current miles balance.
                    example: 48250
        '404':
          description: No account found for the supplied accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flights:
    get:
      operationId: listFlights
      summary: List available flights
      description: >
        List available AeroLatam flights, optionally filtered by origin
        and/or destination airport code (IATA 3-letter codes, e.g. BOG,
        MDE, LIM). Use this to help customers find flights between cities.
        Results are ordered by departure date and time ascending.
      tags:
        - Flights
      parameters:
        - name: origin
          in: query
          required: false
          description: Filter by origin airport IATA code (e.g. BOG).
          schema:
            type: string
          example: BOG
        - name: destination
          in: query
          required: false
          description: Filter by destination airport IATA code (e.g. MDE).
          schema:
            type: string
          example: MDE
      responses:
        '200':
          description: The matching flights.
          content:
            application/json:
              schema:
                type: object
                required:
                  - flights
                  - count
                properties:
                  flights:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Flight'
                  count:
                    type: integer
                    example: 2

  /flights/{flightId}:
    get:
      operationId: getFlight
      summary: Get a flight's details
      description: >
        Get the full details of a single AeroLatam flight by flight id,
        including origin, destination, schedule, price, and available seats.
      tags:
        - Flights
      parameters:
        - name: flightId
          in: path
          required: true
          description: The unique flight identifier.
          schema:
            type: string
          example: flight-AL100
      responses:
        '200':
          description: The flight details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flight'
        '404':
          description: No flight found for the supplied flightId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations:
    post:
      operationId: createReservation
      summary: Create a new flight reservation
      description: >
        Create a new flight reservation for an existing customer. This is a
        state-changing action — confirm with the customer before calling.
        Provide the customerId and flightId; optionally passengerName, email,
        date, time, and free-text notes. Returns the created reservation with
        its generated reservationId and status "pending".
      tags:
        - Reservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - flightId
              properties:
                customerId:
                  type: string
                  description: The customer the reservation is for.
                  example: cust-5001
                flightId:
                  type: string
                  description: The flight to reserve.
                  example: flight-AL100
                passengerName:
                  type: string
                  description: Full name of the passenger.
                  example: María González
                email:
                  type: string
                  description: Contact email for the reservation.
                  example: maria.gonzalez@example.com
                date:
                  type: string
                  format: date
                  description: Departure date for the reservation.
                  example: '2026-08-15'
                time:
                  type: string
                  description: Departure time for the reservation.
                  example: '06:30'
                notes:
                  type: string
                  description: Optional free-text notes about the reservation.
                  example: Window seat preferred.
      responses:
        '201':
          description: The created reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCustomerReservations
      summary: List a customer's reservations
      description: >
        List all reservations for a customer by customerId. Use this to
        check a customer's existing bookings before creating a new one or
        to report reservation status.
      tags:
        - Reservations
      parameters:
        - name: customerId
          in: query
          required: true
          description: The customer whose reservations to list.
          schema:
            type: string
          example: cust-5001
      responses:
        '200':
          description: The customer's reservations.
          content:
            application/json:
              schema:
                type: object
                required:
                  - customerId
                  - reservations
                  - count
                properties:
                  customerId:
                    type: string
                    example: cust-5001
                  reservations:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Reservation'
                  count:
                    type: integer
                    example: 1
        '400':
          description: Missing customerId query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{reservationId}:
    get:
      operationId: getReservation
      summary: Get a reservation's details
      description: >
        Get the full details of a single reservation by reservation id,
        including flight, passenger, dates, and current status.
      tags:
        - Reservations
      parameters:
        - name: reservationId
          in: path
          required: true
          description: The unique reservation identifier.
          schema:
            type: string
          example: res-8001
      responses:
        '200':
          description: The reservation details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: No reservation found for the supplied reservationId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    Account:
      type: object
      required:
        - accountId
        - customerId
        - name
        - email
        - status
      properties:
        accountId:
          type: string
          example: acct-1001
        customerId:
          type: string
          example: cust-5001
        name:
          type: string
          example: María González
        phoneNumber:
          type: string
          example: '+12065550101'
        email:
          type: string
          format: email
          example: maria.gonzalez@example.com
        flights:
          type: array
          maxItems: 50
          items:
            type: string
          description: Flight ids associated with this account.
          example: ['flight-AL100', 'flight-AL305']
        status:
          type: string
          enum: [active, suspended]
          example: active
        membershipTier:
          type: string
          enum: [classic, gold, platinum]
          example: gold
        miles:
          type: number
          description: Current miles balance.
          example: 48250

    Flight:
      type: object
      required:
        - flightId
        - origin
        - destination
        - departureDate
        - departureTime
        - price
      properties:
        flightId:
          type: string
          example: flight-AL100
        origin:
          type: string
          description: Origin airport IATA code.
          example: BOG
        destination:
          type: string
          description: Destination airport IATA code.
          example: MDE
        originCity:
          type: string
          example: Bogotá
        destinationCity:
          type: string
          example: Medellín
        departureDate:
          type: string
          format: date
          example: '2026-08-15'
        departureTime:
          type: string
          example: '06:30'
        arrivalTime:
          type: string
          example: '07:45'
        duration:
          type: string
          example: 1h 15m
        price:
          type: number
          description: Price in USD.
          example: 89
        currency:
          type: string
          example: USD
        airline:
          type: string
          example: AeroLatam
        aircraft:
          type: string
          example: A320
        availableSeats:
          type: integer
          example: 42
        class:
          type: string
          enum: [economy, business, first]
          example: economy
        status:
          type: string
          enum: [scheduled, boarding, departed, arrived, cancelled]
          example: scheduled

    Reservation:
      type: object
      required:
        - reservationId
        - customerId
        - flightId
        - status
        - createdAt
      properties:
        reservationId:
          type: string
          example: res-8001
        customerId:
          type: string
          example: cust-5001
        flightId:
          type: string
          example: flight-AL100
        passengerName:
          type: string
          example: María González
        email:
          type: string
          format: email
          example: maria.gonzalez@example.com
        date:
          type: string
          format: date
          description: Departure date.
          example: '2026-08-15'
        time:
          type: string
          description: Departure time.
          example: '06:30'
        origin:
          type: string
          description: Origin airport IATA code.
          example: BOG
        destination:
          type: string
          description: Destination airport IATA code.
          example: MDE
        status:
          type: string
          enum: [pending, confirmed, cancelled]
          example: confirmed
        createdAt:
          type: string
          format: date-time
          example: '2026-07-20T10:00:00Z'
        notes:
          type: string
          example: Reserva confirmada; asiento 12A.

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: resource not found
